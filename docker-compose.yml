services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: silvercare
      POSTGRES_PASSWORD: silvercare
      POSTGRES_DB: silvercare
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silvercare -d silvercare"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_URL: postgres://silvercare:silvercare@db:5432/silvercare
      CHANNEL_MODE: ${CHANNEL_MODE:-web}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-silvercare-verify}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      CENTER_NAME: ${CENTER_NAME:-銀護居家服務中心}
      SEED_ON_BOOT: "true"
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      VITE_API_BASE: /
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
