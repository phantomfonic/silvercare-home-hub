# Push／PR 時部署到 Vercel（需 GitHub Secrets）
#
# 更簡單（推薦）：在 Vercel 網站 Import 此 GitHub 專案，即可 push 自動部署，不必用本 workflow。
# 見 DEPLOY.md
#
# 若要用本檔：於 GitHub → Settings → Secrets 設定
#   VERCEL_TOKEN、VERCEL_ORG_ID、VERCEL_PROJECT_ID

name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REF: ${{ github.ref }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "未設定 VERCEL_* secrets，略過 Actions 部署。"
            echo "請改用 Vercel Dashboard Import GitHub（見 DEPLOY.md），即可 push 自動部署。"
            exit 0
          fi
          npm install --global vercel@latest
          if [ "$REF" = "refs/heads/main" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            vercel build --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
